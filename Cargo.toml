[package]
name = "omni-code-bridge"
version = "0.6.0"
edition = "2024"
description = "Rust bridge for Omni Code that connects mobile clients to local coding agents"
license = "MIT"
homepage = "https://github.com/omni-stream-ai/omni-code-bridge"
repository = "https://github.com/omni-stream-ai/omni-code-bridge"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
base64 = "0.22"
bzip2 = "0.6"
chrono = { version = "0.4", features = ["serde", "clock"] }
dotenvy = "0.15"
futures-util = "0.3"
hound = "3.5"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.1"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.29"

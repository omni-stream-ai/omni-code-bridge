[package]
name = "omni-relay-connector"
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "Embeddable outbound relay connector for OmniStream Core and Omni Code Bridge"

[dependencies]
anyhow = "1"
async-stream = "0.3"
base64 = "0.22"
futures-util = "0.3"
http = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"

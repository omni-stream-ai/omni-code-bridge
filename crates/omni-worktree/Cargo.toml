[package]
name = "omni-worktree"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Git worktree lifecycle and dependency sharing for Node, Flutter, Rust and Composer"
license = "MIT"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "omni-worktree"
path = "src/main.rs"
required-features = ["cli"]

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
  <meta name="referrer" content="no-referrer">
  <title>Remote desktop</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101720; color: #f4f6fa; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    nav { display: flex; flex-shrink: 0; gap: 4px; padding: 4px; background: #202936; align-items: center; flex-wrap: wrap; }
    button { border: 0; border-radius: 5px; min-height: 40px; padding: 0 10px; background: #344154; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #2463b4; }
    #zoom { margin-left: auto; font-variant-numeric: tabular-nums; padding: 0 8px; }
    #viewport { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; position: relative; }
    #stage { position: relative; }
    iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: top left; }
    #pan-layer { display: none; position: absolute; inset: 0; cursor: grab; touch-action: none; }
    #pan-layer.active { display: block; }
    #native-input { display: none; margin: 4px; padding: 8px; min-height: 42px; font: 16px system-ui; }
    #native-input.active { display: block; }
  </style>
</head>
<body>
  <nav aria-label="Desktop view">
    <button id="fit" aria-pressed="true">Fit</button>
    <button id="actual" aria-pressed="false">100%</button>
    <button id="pan" aria-pressed="false">Pan</button>
    <button id="scroll" aria-pressed="false">Scroll</button>
    <button id="keyboard" aria-pressed="false">Keyboard</button>
    <output id="zoom" aria-live="polite"></output>
  </nav>
  <textarea id="native-input" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Remote keyboard"></textarea>
  <main id="viewport">
    <div id="stage">
      <iframe id="desktop" title="Remote desktop" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
      <div id="pan-layer"></div>
    </div>
  </main>
  <script>
    (() => {
      const width = __DESKTOP_WIDTH__;
      const height = __DESKTOP_HEIGHT__;
      const viewport = document.getElementById('viewport');
      const stage = document.getElementById('stage');
      const frame = document.getElementById('desktop');
      const layer = document.getElementById('pan-layer');
      const fitButton = document.getElementById('fit');
      const actualButton = document.getElementById('actual');
      const panButton = document.getElementById('pan');
      const keyboardButton = document.getElementById('keyboard');
      const scrollButton = document.getElementById('scroll');
      const input = document.getElementById('native-input');
      const zoom = document.getElementById('zoom');
      let fitting = true;
      let panning = false;
      let scrolling = false;
      const chinese = navigator.language.startsWith('zh');
      if (chinese) {
        document.documentElement.lang = 'zh';
        fitButton.textContent = '适应屏幕';
        panButton.textContent = '拖动查看';
        keyboardButton.textContent = '手机键盘';
        scrollButton.textContent = '滚动页面';
        input.placeholder = '输入文字，发送到远程桌面';
        input.setAttribute('aria-label', '手机键盘输入');
      }
      function pan(enabled) {
        panning = enabled;
        if (enabled) scrolling = false;
        scrollButton.setAttribute('aria-pressed', String(scrolling));
        layer.classList.toggle('active', enabled || scrolling);
        panButton.setAttribute('aria-pressed', String(enabled));
        panButton.textContent = chinese ? (enabled ? '恢复操作' : '拖动查看') : (enabled ? 'Control' : 'Pan');
      }
      function layout() {
        // The iframe keeps the acceptance resolution. Browser hit testing maps
        // touches through the CSS transform into the original Xpra coordinates.
        const scale = fitting ? Math.min(1, viewport.clientWidth / width, viewport.clientHeight / height) : 1;
        frame.style.width = width + 'px';
        frame.style.height = height + 'px';
        frame.style.transform = 'scale(' + scale + ')';
        stage.style.width = Math.ceil(width * scale) + 'px';
        stage.style.height = Math.ceil(height * scale) + 'px';
        zoom.textContent = Math.round(scale * 100) + '%';
        fitButton.setAttribute('aria-pressed', String(fitting));
        actualButton.setAttribute('aria-pressed', String(!fitting));
        if (fitting) viewport.scrollTo(0, 0);
      }
      fitButton.onclick = () => { fitting = true; pan(false); layout(); };
      actualButton.onclick = () => { fitting = false; layout(); };
      panButton.onclick = () => pan(!panning);
      scrollButton.onclick = () => {
        const enabled = !scrolling;
        pan(false);
        scrolling = enabled;
        layer.classList.toggle('active', enabled);
        scrollButton.setAttribute('aria-pressed', String(enabled));
      };
      keyboardButton.onclick = () => {
        const enabled = !input.classList.contains('active');
        input.classList.toggle('active', enabled);
        keyboardButton.setAttribute('aria-pressed', String(enabled));
        if (enabled) input.focus();
        else input.blur();
      };
      // A real editable element is required to open Android/iOS keyboards.
      // Send committed IME text only, so Chinese composition is not duplicated.
      function sendKey(name, text, keyval) {
        const client = frame.contentWindow.client;
        if (!client?.connected || client.server_readonly) return;
        const wid = client.focused_wid || client.topwindow;
        if (!wid) return;
        for (const pressed of [true, false]) {
          client.send(['key-action', wid, name, pressed, [], keyval, text, 0, 0]);
        }
      }
      function commit() {
        for (const char of input.value) {
          const point = char.codePointAt(0);
          const special = {'\n': ['Return', 0xff0d], ' ': ['space', 32]};
          const [name, value] = special[char] ||
            [point <= 255 ? char : 'U' + point.toString(16).toUpperCase(),
             point <= 255 ? point : 0x01000000 + point];
          sendKey(name, char, value);
        }
        input.value = '';
      }
      let composing = false;
      input.addEventListener('compositionstart', () => { composing = true; });
      input.addEventListener('compositionend', () => { composing = false; commit(); });
      input.addEventListener('input', event => {
        if (composing || event.isComposing) return;
        if (event.inputType === 'deleteContentBackward') sendKey('BackSpace', '', 0xff08);
        else commit();
      });
      input.addEventListener('keydown', event => {
        if (composing || event.isComposing || event.keyCode === 229) return;
        const special = {Backspace: ['BackSpace', 0xff08], Enter: ['Return', 0xff0d], Tab: ['Tab', 0xff09]};
        if (special[event.key]) {
          event.preventDefault();
          sendKey(special[event.key][0], '', special[event.key][1]);
        }
      });
      function wheel(x, y, dx, dy) {
        const remote = frame.contentWindow;
        const target = remote.document.elementFromPoint(x, y);
        target?.dispatchEvent(new remote.WheelEvent('wheel', {
          bubbles: true, cancelable: true, clientX: x, clientY: y,
          deltaX: dx, deltaY: dy, deltaMode: 0,
        }));
      }
      let last = null;
      layer.onpointerdown = event => {
        last = [event.clientX, event.clientY];
        layer.setPointerCapture(event.pointerId);
      };
      layer.onpointermove = event => {
        if (!last) return;
        if (scrolling) {
          const rect = frame.getBoundingClientRect();
          const scale = rect.width / width;
          wheel((event.clientX - rect.left) / scale, (event.clientY - rect.top) / scale,
            (last[0] - event.clientX) / scale, (last[1] - event.clientY) / scale);
        } else viewport.scrollBy(last[0] - event.clientX, last[1] - event.clientY);
        last = [event.clientX, event.clientY];
      };
      layer.onpointerup = layer.onpointercancel = () => { last = null; };
      new ResizeObserver(layout).observe(viewport);
      layout();
      frame.onload = () => {
        // Xpra prevents the default pointer action. Explicitly focus the frame
        // so a touch still routes hardware keys and clipboard events to Xpra.
        let touch = null;
        const doc = frame.contentDocument;
        doc.addEventListener('touchstart', event => {
          if (event.touches.length !== 2) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          touch = [event.touches[0].clientX, event.touches[0].clientY];
        }, {capture: true, passive: false});
        doc.addEventListener('touchmove', event => {
          if (!touch) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          const point = event.touches[0];
          if (!point) return;
          wheel(point.clientX, point.clientY, touch[0] - point.clientX, touch[1] - point.clientY);
          touch = [point.clientX, point.clientY];
        }, {capture: true, passive: false});
        const end = () => { touch = null; };
        doc.addEventListener('touchend', end, true);
        doc.addEventListener('touchcancel', end, true);
        const focus = () => frame.contentWindow.focus();
        frame.contentDocument.addEventListener('pointerdown', focus, true);
        frame.contentDocument.addEventListener('touchstart', focus, {capture: true, passive: true});
      };
      const url = new URL('index.html', location.href);
      url.searchParams.set('path', new URL('./', location.href).pathname);
      url.searchParams.set('autoconnect', 'true');
      url.searchParams.set('keyboard', 'false');
      url.searchParams.set('floating_menu', 'false');
      frame.src = url.href;
    })();
  </script>
</body>
</html>

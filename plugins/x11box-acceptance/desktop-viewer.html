<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Remote desktop</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101720; color: #f4f6fa; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    nav { display: flex; flex-shrink: 0; gap: 4px; padding: 4px; background: #202936; align-items: center; flex-wrap: wrap; }
    button { border: 0; border-radius: 5px; min-height: 40px; padding: 0 10px; background: #344154; color: inherit; font: inherit; cursor: pointer; }
    button[aria-pressed="true"] { background: #2463b4; }
    #zoom { margin-left: auto; font-variant-numeric: tabular-nums; padding: 0 8px; }
    #viewport { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; position: relative; }
    #stage { position: relative; }
    iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: top left; }
    #native-input { display: none; position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; padding: 0; border: 0; font: 16px system-ui; }
    #native-input.active { display: block; }
    #keys { display: none; gap: 4px; overflow-x: auto; padding: 4px; flex-shrink: 0; }
    #keys.active { display: flex; }
    #keys button { flex-shrink: 0; }
    #connection { padding: 4px 8px; font-size: 12px; }
    #gesture-help { padding: 4px 8px; font-size: 12px; color: #c2ccd8; }
  </style>
</head>
<body>
  <nav aria-label="Desktop view">
    <button id="fit" aria-pressed="true">Fit</button>
    <button id="keyboard" aria-pressed="false">Keyboard</button>
    <output id="zoom" aria-live="polite"></output>
  </nav>
  <output id="connection" role="status" aria-live="polite"></output>
  <div id="keys" aria-label="Remote keys"></div>
  <details id="gesture-help"><summary id="gesture-title">Touch gestures</summary><span id="gesture-text">Tap to click. Drag to pan the desktop. Two fingers scroll content; pinch to zoom. Hold then drag to move remote items.</span></details>
  <textarea id="native-input" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Remote keyboard"></textarea>
  <main id="viewport">
    <div id="stage">
      <iframe id="desktop" title="Remote desktop" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    </div>
  </main>

            }
            void checkInputFocus();
          }
          if (gesture.panned && event.type !== 'touchcancel' && performance.now() - gesture.time < 80) inertia(gesture.vx, gesture.vy);
          gesture = null;
        }
        doc.addEventListener('touchstart', touchStart, {capture: true, passive: false});
        doc.addEventListener('touchmove', touchMove, {capture: true, passive: false});
        doc.addEventListener('touchend', end, {capture: true, passive: false});
        doc.addEventListener('touchcancel', end, {capture: true, passive: false});

      };
      const url = new URL('index.html', location.href);
      url.searchParams.set('path', new URL('./', location.href).pathname);
      url.searchParams.set('autoconnect', 'true');
      url.searchParams.set('keyboard', 'false');
      url.searchParams.set('clipboard_preferred_format', 'UTF8_STRING');
      url.searchParams.set('clipboard_poll', 'false');
      url.searchParams.set('reconnect', 'true');
      url.searchParams.set('floating_menu', 'false');
      frame.src = url.href;
    })();
